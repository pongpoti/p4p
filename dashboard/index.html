<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKHONMSO P4P — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* shadcn/ui's design language (its Card, Badge, Progress and Button
           components, token names and spacing) rebuilt in plain CSS, since
           the live site is not a React app. Colours keep the app's brown and
           tan (design.md); surfaces are frosted glass over a light, warm
           gradient. The layout follows the OPD Ortho SKH app shell: sticky
           header with the app name and module nav, then one centred column. */
        :root {
            --background: #FAF5EE;
            --foreground: #241C16;
            --card: rgba(255, 255, 255, .58);
            --card-border: rgba(255, 255, 255, .75);
            --primary: #3F2F24;
            --primary-foreground: #FFFFFF;
            --accent: rgba(166, 137, 102, .14);
            --muted-foreground: #5F5045;
            --border: rgba(63, 47, 36, .11);
            --ring: #2F6FDB;
            --success: #157F3D;
            --success-bg: rgba(21, 127, 61, .1);
            --warning: #965800;
            --warning-bg: rgba(217, 140, 0, .13);
            --radius: 14px;
            --content-w: 72rem;
            --shadow: 0 1px 2px rgba(41, 29, 20, .05), 0 8px 24px -6px rgba(41, 29, 20, .1);
            --shadow-hover: 0 2px 4px rgba(41, 29, 20, .06), 0 16px 36px -8px rgba(41, 29, 20, .16);
            --highlight: inset 0 1px 0 rgba(255, 255, 255, .85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            font-size: 1rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Shared accessibility basics: a visible keyboard focus ring, a
           skip link / screen-reader-only text, and no motion for people who
           asked their OS for less. */
        :focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        #skip-link {
            position: absolute;
            left: 16px; top: -100px;
            z-index: 100;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--primary);
            color: var(--primary-foreground);
            font-weight: 600;
            text-decoration: none;
        }
        #skip-link:focus { top: 12px; }

        /* Soft colour fields behind the glass, so the blur has something
           to pick up. Same background as login.html. */
        #bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(40rem 28rem at 8% 0%, rgba(222, 190, 145, .42), transparent 70%),
                radial-gradient(36rem 26rem at 95% 8%, rgba(196, 170, 220, .2), transparent 70%),
                radial-gradient(40rem 30rem at 85% 95%, rgba(150, 208, 216, .2), transparent 70%),
                radial-gradient(34rem 26rem at 10% 95%, rgba(240, 180, 160, .2), transparent 70%),
                linear-gradient(160deg, #FBF6EF 0%, #F8F1E7 50%, #FBF7F1 100%);
        }

        .hidden { display: none !important; }

        .container {
            width: 100%;
            max-width: var(--content-w);
            margin: 0 auto;
            padding-left: 32px;
            padding-right: 32px;
        }

        .glass {
            background: var(--card);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow), var(--highlight);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }

        .ico { width: 18px; height: 18px; flex-shrink: 0; }

        /* ── Mobile block (inverse of the LIFF pages' desktop block) ───── */
        #mobile-block {
            display: none;
            position: fixed; inset: 0;
            background: var(--background);
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 32px; z-index: 999;
        }
        #mobile-block h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        #mobile-block p { color: var(--muted-foreground); }

        /* ── Sticky header ────────────────────────────────────────────── */
        #header {
            position: sticky;
            top: 0;
            z-index: 15;
            background: rgba(255, 255, 255, .55);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }
        #header .container {
            display: flex;
            align-items: center;
            gap: 24px;
            height: 76px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -.01em;
            color: var(--foreground);
            text-decoration: none;
            border-radius: 10px;
        }

        /* P4P text mark: brown tile, the "4" picked out in a light tan. */
        .logo-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1;
            color: #fff;
            background: linear-gradient(180deg, #54402F, #3F2F24);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(0, 0, 0, .2);
        }
        .logo-mark b { color: #DDBF94; font-weight: 800; }
        #brand .logo-mark { height: 38px; padding: 0 10px; border-radius: 10px; font-size: 1.1rem; }

        #nav { display: flex; gap: 12px; }
        /* shadcn "ghost" button; the current page gets the solid brown
           "default" fill so it stands out from the white header. */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: 48px;
            padding: 0 20px;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--muted-foreground);
            text-decoration: none;
            border: 1px solid rgba(63, 47, 36, .2);
            background: rgba(255, 255, 255, .5);
            transition: background .15s, color .15s, border-color .15s;
        }
        .nav-btn .ico { width: 20px; height: 20px; }
        .nav-btn:hover { background: var(--accent); color: var(--foreground); }
        .nav-btn.active {
            background: linear-gradient(180deg, #54402F, var(--primary));
            color: var(--primary-foreground);
            font-weight: 600;
            border-color: transparent;
            box-shadow: 0 1px 2px rgba(41, 29, 20, .2), inset 0 1px 0 rgba(255, 255, 255, .15);
        }

        #header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        #user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .95rem;
            font-weight: 500;
            color: var(--muted-foreground);
        }
        #user-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent);
            border: 1px solid var(--border);
            color: var(--foreground);
            font-weight: 600;
            font-size: .9rem;
        }
        #user-avatar:empty { display: none; }
        .sep { width: 1px; height: 24px; background: var(--border); }
        /* shadcn "secondary" button: a tan fill and border, so it reads as a
           button against the white header. */
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 44px;
            padding: 0 14px;
            border: 1px solid rgba(124, 96, 66, .35);
            border-radius: 10px;
            background: #EADCC8;
            color: var(--primary);
            font-family: inherit;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(41, 29, 20, .08), inset 0 1px 0 rgba(255, 255, 255, .5);
            transition: background .15s;
        }
        .btn-secondary:hover { background: #E0CDB3; }

        /* ── Content: the six cards fill the space under the 77px header
           (76px plus its border), so
           all of them fit on one screen without scrolling. Sizes below scale
           with the window height (vh); very short windows scroll instead. */
        main {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 77px);
            height: calc(100dvh - 77px);
            min-height: 560px;
            padding-top: clamp(16px, 3vh, 32px);
            padding-bottom: clamp(16px, 3vh, 32px);
        }

        /* ── Month cards (shadcn Card) ────────────────────────────────── */
        #months {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: clamp(12px, 2.2vh, 20px);
        }

        .month-card {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            transition: box-shadow .2s, transform .2s;
        }
        .month-card:not(.skeleton):hover { box-shadow: var(--shadow-hover), var(--highlight); transform: translateY(-2px); }
        /* The month's colour from the LINE status menu, as a wash across the
           top of the card plus the label chip. */
        .month-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 96px;
            background: linear-gradient(180deg, var(--month, transparent), transparent);
            opacity: .4;
            pointer-events: none;
        }
        .card-header, .card-content, .card-footer { position: relative; padding-left: 22px; padding-right: 22px; }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: clamp(12px, 2.2vh, 20px);
        }
        .month-chip {
            display: inline-flex;
            align-items: center;
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            background: var(--month);
            color: #2d2d2d;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 1px 2px rgba(41, 29, 20, .12);
        }
        /* ตามส่ง tab: the whole card in its month colour, a lighter chip, the
           ส่งแล้ว / ค้างส่ง boxes as on ภาพรวม, and no footer. */
        #months.followup .month-card {
            background: var(--month);
            border-color: rgba(41, 29, 20, .12);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        #months.followup .month-card::before { display: none; }
        #months.followup .card-header { justify-content: center; padding-top: clamp(16px, 3vh, 28px); }
        #months.followup .badge { display: none; }
        #months.followup .month-chip {
            height: 48px;
            padding: 0 26px;
            font-size: 1.375rem;
            background: color-mix(in srgb, var(--month) 18%, #fff);
            box-shadow: 0 1px 3px rgba(41, 29, 20, .15);
        }
        #months.followup .stat { justify-content: center; }
        #months.followup .stat .pct { color: #241a12; }
        #months.followup .stat .of { color: #241a12; }
        #months.followup .stat .of b { color: #241a12; }
        #months.followup .progress { height: 10px; background: rgba(255, 255, 255, .75); box-shadow: inset 0 0 0 1px rgba(41, 29, 20, .12); }
        #months.followup .progress > span { background: #2E2219; }
        #months.followup .split div { background: #FDFAF5; }
        #months.followup .card-footer { display: none; }
        #months.followup .card-content { padding-bottom: clamp(14px, 2.6vh, 24px); }

        /* shadcn Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: .8125rem;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge.done { color: var(--success); background: var(--success-bg); border-color: rgba(21, 127, 61, .18); }
        .badge.open { color: var(--warning); background: var(--warning-bg); border-color: rgba(217, 140, 0, .22); }
        .badge.idle { color: var(--muted-foreground); background: rgba(255, 255, 255, .65); border-color: var(--border); }

        /* Centred between the header and footer, so taller windows spread
           the card out rather than leaving a gap at the bottom. */
        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: clamp(10px, 2.4vh, 22px);
            padding-bottom: clamp(10px, 2vh, 18px);
        }
        .stat { display: flex; align-items: baseline; gap: 10px; }
        .stat .pct { font-size: clamp(1rem, 2.2vh, 1.25rem); font-weight: 600; color: var(--muted-foreground); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
        .stat .of { color: var(--muted-foreground); font-size: clamp(1.0625rem, 2.6vh, 1.375rem); font-weight: 500; }
        .stat .of b { color: var(--foreground); font-weight: 700; font-variant-numeric: tabular-nums; }

        /* shadcn Progress */
        .progress {
            margin-top: clamp(8px, 2.2vh, 24px);
            height: 8px;
            border-radius: 999px;
            background: rgba(63, 47, 36, .09);
            overflow: hidden;
        }
        .progress > span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--primary);
            transition: width .6s ease;
        }
        .month-card.complete .progress > span { background: var(--success); }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: clamp(8px, 2.4vh, 28px);
        }
        .split div {
            padding: clamp(6px, 1.6vh, 16px) 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .55);
            border: 1px solid var(--border);
        }
        .split dt { font-size: 1rem; font-weight: 600; color: var(--muted-foreground); }
        .split dd { font-size: clamp(1.75rem, 5.4vh, 3.25rem); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
        .split .pending dd { color: var(--warning); }
        .split .pending.zero dd { color: var(--muted-foreground); }

        .card-footer {
            margin-top: auto;
            padding-top: clamp(8px, 1.5vh, 14px);
            padding-bottom: clamp(10px, 1.8vh, 18px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .875rem;
            color: var(--muted-foreground);
        }
        .card-footer .ico { width: 16px; height: 16px; }

        .no-roster .card-content p { color: var(--muted-foreground); padding-bottom: 22px; }

        /* Loading placeholders (shadcn Skeleton) */
        
        .skeleton .bar {
            margin: 22px;
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(63, 47, 36, .05), rgba(63, 47, 36, .1), rgba(63, 47, 36, .05));
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite linear;
        }
        .skeleton .bar.chip { height: 34px; width: 45%; }
        .skeleton .bar.body { height: 120px; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--muted-foreground);
            font-size: 1.25rem;
        }
        .empty svg { width: 56px; height: 56px; color: var(--success); }

        .alert {
            margin-bottom: 20px;
            padding: 16px 20px;
            border-radius: var(--radius);
            color: #8A1C12;
            background: rgba(253, 236, 234, .85);
            border: 1px solid rgba(192, 57, 43, .25);
        }
    </style>
</head>

<body>
    <a id="skip-link" href="#main">ข้ามไปยังเนื้อหา</a>
    <div id="bg" aria-hidden="true"></div>

    <div id="mobile-block" role="alert">
        <h2>ใช้งานได้บนคอมพิวเตอร์เท่านั้น</h2>
        <p>กรุณาเปิดหน้านี้บนคอมพิวเตอร์</p>
    </div>

    <header id="header">
        <div class="container">
            <a id="brand" href="/dashboard/" aria-label="SAKHONMSO P4P — หน้าแรก">
                <span class="logo-mark" aria-hidden="true">P<b>4</b>P</span>
                <span>SAKHONMSO</span>
            </a>
            <nav id="nav" aria-label="เมนูหลัก">
                <a class="nav-btn active" href="/dashboard/#overview" data-view="overview" aria-current="page">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1" />
                        <rect x="14" y="3" width="7" height="5" rx="1" />
                        <rect x="14" y="12" width="7" height="9" rx="1" />
                        <rect x="3" y="16" width="7" height="5" rx="1" />
                    </svg>
                    ภาพรวม
                </a>
                <a class="nav-btn" href="/dashboard/#followup" data-view="followup">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                    ตามส่ง
                </a>
            </nav>
            <div id="header-actions">
                <span id="user" aria-label="ผู้ใช้ที่เข้าสู่ระบบ">
                    <span id="user-avatar" aria-hidden="true"></span>
                    <span id="user-name"></span>
                </span>
                <span class="sep" aria-hidden="true"></span>
                <button type="button" id="logout-btn" class="btn-secondary">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <path d="m16 17 5-5-5-5" />
                        <path d="M21 12H9" />
                    </svg>
                    ออกจากระบบ
                </button>
            </div>
        </div>
    </header>

    <main id="main" class="container" tabindex="-1">
        <h1 id="page-title" class="sr-only">ภาพรวม — สถานะการส่งไฟล์ Excel 6 เดือนที่ผ่านมา</h1>

        <div id="error" class="alert hidden" role="alert">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้านี้</div>

        <div id="empty" class="empty hidden" role="status">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
            <p>ทุกเดือนส่งครบแล้ว ไม่มีรายการที่ต้องตามส่ง</p>
        </div>

        <section id="months" aria-label="สถานะการส่งไฟล์รายเดือน" aria-busy="true">
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
            <div class="month-card glass skeleton" aria-hidden="true"><div class="bar chip"></div><div class="bar body"></div></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
