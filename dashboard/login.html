<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKHONMSO P4P — เข้าสู่ระบบ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Same shadcn-style tokens, glass and background as
           dashboard/index.html. */
        :root {
            --background: #FAF5EE;
            --foreground: #241C16;
            --card: rgba(255, 255, 255, .58);
            --card-border: rgba(255, 255, 255, .75);
            --primary: #3F2F24;
            --muted-foreground: #5F5045;
            --border: rgba(63, 47, 36, .11);
            --ring: #2F6FDB;
            --danger: #A3271B;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-size: 1rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Shared accessibility basics: a visible keyboard focus ring,
           screen-reader-only text, and no motion for people who asked their
           OS for less. */
        :focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(40rem 28rem at 8% 0%, rgba(222, 190, 145, .42), transparent 70%),
                radial-gradient(36rem 26rem at 95% 8%, rgba(196, 170, 220, .2), transparent 70%),
                radial-gradient(40rem 30rem at 85% 95%, rgba(150, 208, 216, .2), transparent 70%),
                radial-gradient(34rem 26rem at 10% 95%, rgba(240, 180, 160, .2), transparent 70%),
                linear-gradient(160deg, #FBF6EF 0%, #F8F1E7 50%, #FBF7F1 100%);
        }

        #mobile-block {
            display: none;
            position: fixed; inset: 0;
            background: var(--background);
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 32px; z-index: 999;
        }
        #mobile-block h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        #mobile-block p { color: var(--muted-foreground); }

        /* shadcn Card, frosted. */
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px 32px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 1px 2px rgba(41, 29, 20, .05), 0 20px 48px -12px rgba(41, 29, 20, .18), inset 0 1px 0 rgba(255, 255, 255, .85);
        }
        /* P4P text mark: brown tile, the "4" picked out in a light tan. */
        .logo-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1;
            color: #fff;
            background: linear-gradient(180deg, #54402F, #3F2F24);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 4px 12px -2px rgba(63, 47, 36, .35);
        }
        .logo-mark b { color: #DDBF94; font-weight: 800; }
        .logo {
            display: flex;
            width: fit-content;
            height: 64px;
            padding: 0 18px;
            margin: 0 auto 20px;
            border-radius: 16px;
            font-size: 1.9rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.3;
        }
        .subtitle { margin-top: 4px; color: var(--muted-foreground); }

        .error {
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(253, 236, 234, .85);
            border: 1px solid rgba(192, 57, 43, .22);
            color: var(--danger);
            font-size: .95rem;
        }

        #line-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            height: 48px;
            border-radius: 10px;
            /* A slightly deeper take on LINE's brand green, bold label for legibility. */
            background: #05B14C;
            color: #fff;
            font-size: 1.0625rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .1), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: background .15s;
        }
        #line-login:hover { background: #049A42; }
        #line-login svg { width: 22px; height: 22px; }

        .note { margin-top: 18px; color: var(--muted-foreground); font-size: .875rem; }
    </style>
</head>

<body>
    <div id="bg" aria-hidden="true"></div>

    <div id="mobile-block" role="alert">
        <h2>ใช้งานได้บนคอมพิวเตอร์เท่านั้น</h2>
        <p>กรุณาเปิดหน้านี้บนคอมพิวเตอร์</p>
    </div>

    <main class="card" aria-labelledby="login-title">
        <div class="logo-mark logo" aria-hidden="true">P<b>4</b>P</div>
        <h1 id="login-title">SAKHONMSO <span class="sr-only">P4P</span></h1>
        <p class="subtitle">องค์กรแพทย์ ร.พ. สมุทรสาคร</p>
        __LOGIN_ERROR__
        <a id="line-login" href="/dashboard/auth/line">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3C6.48 3 2 6.6 2 11.04c0 3.98 3.55 7.31 8.35 7.94.33.07.77.22.88.5.1.25.07.65.03.9l-.14.85c-.04.25-.2.98.86.53 1.06-.44 5.72-3.37 7.8-5.77C21.21 14.42 22 12.82 22 11.04 22 6.6 17.52 3 12 3z" />
            </svg>
            เข้าสู่ระบบด้วย LINE
        </a>
        <p class="note">สำหรับผู้ดูแลระบบที่ได้รับอนุญาตเท่านั้น</p>
    </main>

    <script src="login.js"></script>
</body>

</html>
