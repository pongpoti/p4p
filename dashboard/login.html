<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAKHONMSO P4P — เข้าสู่ระบบ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Thai+Looped:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        /* Same tokens and background as dashboard/index.html. */
        :root {
            --primary: #A68966;
            --primary-soft: rgba(166, 137, 102, .24);
            --secondary: #3F2F24;
            --neutral: #FAF9F6;
            --text: #241C16;
            /* Darkened for WCAG AA contrast, as in dashboard/index.html. */
            --text-muted: #5A4A3D;
            --muted: #76675A;
            --border: #e4ddd3;
            --danger: #c0392b;
            --danger-soft: #fdecea;
            --glass-bg: rgba(255, 255, 255, .9);
            --glass-border: rgba(166, 137, 102, .32);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            background: var(--neutral);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-size: 1.0625rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Shared accessibility basics: a visible keyboard focus ring, a
           skip link / screen-reader-only text, and no motion for people who
           asked their OS for less. */
        :focus-visible {
            outline: 3px solid #2F6FDB;
            outline-offset: 2px;
        }
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 10%, #E4CBA6 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, #EBD5B6 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, #E7D1B3 0%, transparent 55%),
                linear-gradient(160deg, #FAF3E8 0%, #F6EDDF 50%, #FBF7F0 100%);
        }

        #mobile-block {
            display: none;
            position: fixed; inset: 0;
            background: var(--neutral);
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 32px; z-index: 999;
        }
        #mobile-block h2 {
            font-family: "Manrope", "Noto Sans Thai Looped", sans-serif;
            font-size: 1.5rem; font-weight: 700; color: var(--secondary); margin-bottom: 8px;
        }
        #mobile-block p { color: var(--muted); font-size: 1.0625rem; }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 44px 36px 36px;
            text-align: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 36px rgba(75, 61, 51, .14);
        }
        /* P4P text mark: brown tile, the "4" picked out in a light tan. */
        .logo-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Manrope", sans-serif;
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1;
            color: #fff;
            background: var(--secondary);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15);
        }
        .logo-mark b { color: #DDBF94; font-weight: 800; }
        .logo {
            display: flex;
            width: fit-content;
            height: 72px;
            padding: 0 20px;
            margin: 0 auto 20px;
            border-radius: 18px;
            font-size: 2.1rem;
        }
        h1 {
            font-family: "Manrope", "Noto Sans Thai Looped", sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--secondary);
        }
        .subtitle { margin-top: 6px; color: var(--text-muted); font-size: 1.0625rem; }

        .error {
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 1rem;
        }

        #line-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            height: 52px;
            border-radius: var(--radius-sm);
            /* LINE's own brand green, bold label for legibility. */
            background: #06C755;
            color: #fff;
            font-size: 1.125rem;
            font-weight: 700;
            text-decoration: none;
            transition: background .15s;
        }
        #line-login:hover { background: #05B34C; }
        #line-login svg { width: 24px; height: 24px; }

        .note { margin-top: 18px; color: var(--muted); font-size: .9375rem; }
    </style>
</head>

<body>
    <div id="bg" aria-hidden="true"></div>

    <div id="mobile-block" role="alert">
        <h2>ใช้งานได้บนคอมพิวเตอร์เท่านั้น</h2>
        <p>กรุณาเปิดหน้านี้บนคอมพิวเตอร์</p>
    </div>

    <main class="card" aria-labelledby="login-title">
        <div class="logo-mark logo" aria-hidden="true">P<b>4</b>P</div>
        <h1 id="login-title">SAKHONMSO <span class="sr-only">P4P</span></h1>
        <p class="subtitle">แดชบอร์ดผู้ดูแลระบบ</p>
        __LOGIN_ERROR__
        <a id="line-login" href="/dashboard/auth/line">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3C6.48 3 2 6.6 2 11.04c0 3.98 3.55 7.31 8.35 7.94.33.07.77.22.88.5.1.25.07.65.03.9l-.14.85c-.04.25-.2.98.86.53 1.06-.44 5.72-3.37 7.8-5.77C21.21 14.42 22 12.82 22 11.04 22 6.6 17.52 3 12 3z" />
            </svg>
            เข้าสู่ระบบด้วย LINE
        </a>
        <p class="note">สำหรับผู้ดูแลระบบที่ได้รับอนุญาตเท่านั้น</p>
    </main>

    <script src="login.js"></script>
</body>

</html>
