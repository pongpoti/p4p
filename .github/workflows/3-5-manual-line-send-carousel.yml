name: "3.5 Manual · LINE: send feature carousel"

# Manually send the feature-carousel Flex message.
#
#   mode = test       → push to a single user (LINE_USER_ID) only. SAFE default;
#                       use this to verify images render before sending to all.
#   mode = broadcast  → send to ALL followers of the LINE OA. Explicit opt-in.
#
# Uses the existing channel access token secret (LINE_ACCESS_TOKEN if set,
# otherwise falls back to LINE_TOKEN, which the rich-menu workflows use — it's
# the same channel's token).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = push to your own LINE only; broadcast = send to ALL followers"
        required: true
        type: choice
        default: test
        options:
          - test
          - broadcast
      version:
        description: "Carousel release version: v followed by a number (v1, v2, ...)"
        required: true
        default: v1

# Checkout is all this job needs from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # The version names a file (assets/cards/feature-carousel.<version>.flex.json).
      # It reaches every script only through the VERSION env var, never pasted
      # into the run: text, and must look like v1, so a crafted value can
      # neither run as shell nor point outside that folder.
      - name: Check version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+$ ]]; then
            echo "::error::version must be v followed by a number, e.g. v1"
            exit 1
          fi
          if [ ! -f "assets/cards/feature-carousel.$VERSION.flex.json" ]; then
            echo "::error::No carousel for $VERSION in assets/cards/"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate Flex message
        # LINE_ACCESS_TOKEN takes precedence over LINE_TOKEN whenever it's
        # set, even if stale — the rich-menu workflows that work use
        # LINE_TOKEN only. (Previously this step's presence/absence was
        # logged via a dedicated debug step; removed since echoing even just
        # secret-presence booleans to a workflow log has no real diagnostic
        # value here and sets a bad precedent for future secrets.)
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN || secrets.LINE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npx tsx scripts/validate-flex.mts "$VERSION"

      - name: Test-send to a single user
        if: inputs.mode == 'test'
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN || secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          VERSION: ${{ inputs.version }}
        run: npx tsx scripts/send-test-flex.mts "$VERSION"

      - name: Broadcast to all followers
        if: inputs.mode == 'broadcast'
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN || secrets.LINE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npx tsx scripts/broadcast-flex.mts "$VERSION"
