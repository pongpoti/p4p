name: "2.4 Monthly: create next month's roster table"

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  # Makes sure the current Bangkok month's roster table exists, and on the
  # last day of a month next month's as well, so a month's table is there
  # before anyone submits P4P for it.
  #
  # Twice EVERY day, not once a month: GitHub delays scheduled runs by hours
  # and sometimes drops them (see 1-always-on-process-line-uploads-and-emails.yml).
  # The old schedule had one useful tick a month (18:00 UTC on the last day,
  # kept only if it still started before UTC midnight), so one dropped or late
  # tick left the month with no table. Now each run asks Supabase which month
  # tables exist and creates only the missing ones, so the other runs of the
  # month do nothing and send nothing. Month keys come from the Bangkok date
  # when the run actually starts, so a late run still picks the right month.
  #
  #   16:07 UTC = 23:07 Bangkok. On the last day of the month: next month's
  #               table, an hour before the month starts.
  #   18:07 UTC = 01:07 Bangkok. The old run time: creates the month's table
  #               if 23:07 was missed. Every later day retries again.
  #
  # Next month's table is created on the last day only, not earlier: its
  # roster is copied from this month's table at that moment, so roster changes
  # made after it would not carry over.
  schedule:
    - cron: '7 16 * * *'
    - cron: '7 18 * * *'

  # Leave inputs blank to do what the schedule does (create the current
  # month's table if missing, plus next month's on the last day). Set them to
  # backfill/repair a specific month (e.g. new_key=2569_08, old_key=2569_07);
  # that goes straight to the script, which skips a table that already exists.
  workflow_dispatch:
    inputs:
      new_key:
        description: "New month key to create (blank = current Bangkok month), e.g. 2569_08"
        required: false
        default: ""
      old_key:
        description: "Month to copy from (blank = previous month), e.g. 2569_07"
        required: false
        default: ""

permissions:
  contents: read

# One run at a time: two runs creating the same table at once would make one
# of them fail.
concurrency:
  group: provision-month
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Find month tables to create
        id: plan
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          NEW_KEY_INPUT: ${{ inputs.new_key }}
          OLD_KEY_INPUT: ${{ inputs.old_key }}
        run: |
          set -euo pipefail

          # Manual repair or backfill: pass the keys on as typed.
          if [ -n "$NEW_KEY_INPUT$OLD_KEY_INPUT" ]; then
            for k in "$NEW_KEY_INPUT" "$OLD_KEY_INPUT"; do
              if [ -n "$k" ] && ! [[ "$k" =~ ^[0-9]{4}_[0-9]{2}$ ]]; then
                echo "::error::Month keys look like 2569_08 (Buddhist year, underscore, month)."
                exit 1
              fi
            done
            echo "todo=$NEW_KEY_INPUT:$OLD_KEY_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Month key (Buddhist year _ month) of a calendar date.
          key() { local ym; ym=$(TZ=UTC date -d "$1" +%Y_%m); echo "$(( ${ym%_*} + 543 ))_${ym#*_}"; }

          today=$(TZ=Asia/Bangkok date +%F)
          tomorrow=$(TZ=UTC date -d "$today +1 day" +%F)
          cur=$(key "$today")
          prev=$(key "$(TZ=UTC date -d "${today%-*}-01 -1 day" +%F)")

          todo=""
          # $1 = month table to create if missing, $2 = month to copy the roster from.
          plan() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --head --max-time 30 \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
              "${SUPABASE_URL%/}/rest/v1/$1?select=*&limit=1" || true)
            if [ "$code" = 200 ]; then
              echo "public.\"$1\" exists."
            else
              # 404 means missing. Anything else is unknown, and the script is
              # safe either way: it skips a table that exists and reports a
              # real error itself.
              echo "public.\"$1\": HTTP $code, will create it from public.\"$2\"."
              todo="$todo $1:$2"
            fi
          }

          plan "$cur" "$prev"
          if [ "${tomorrow##*-}" = 01 ]; then
            plan "$(key "$tomorrow")" "$cur"
          fi
          echo "todo=${todo# }" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.plan.outputs.todo != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.plan.outputs.todo != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        if: steps.plan.outputs.todo != ''
        working-directory: automation
        run: npm ci

      # Each pair is "new:old". The script sends the Telegram message (created,
      # skipped or failed) and exits non-zero on failure, which 1.2 also reports.
      - name: Provision new month table
        if: steps.plan.outputs.todo != ''
        working-directory: automation
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TODO:               ${{ steps.plan.outputs.todo }}
        run: |
          set -euo pipefail
          for pair in $TODO; do
            NEW_KEY="${pair%%:*}" OLD_KEY="${pair#*:}" npx tsx scripts/provision-next-month.ts
          done
