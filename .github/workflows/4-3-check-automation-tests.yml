name: "4.3 Check: automation tests"

on:
  push:
    paths:
      - "automation/**"
      # automation/zip-guard.ts loads lib/p4p-score.ts at run time, and
      # automation's tests read it, so a change there must run these tests.
      - "lib/p4p-score.ts"
      - ".github/workflows/4-3-check-automation-tests.yml"
  pull_request:
    paths:
      - "automation/**"
      # automation/zip-guard.ts loads lib/p4p-score.ts at run time, and
      # automation's tests read it, so a change there must run these tests.
      - "lib/p4p-score.ts"
      - ".github/workflows/4-3-check-automation-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - run: npm ci

      - run: npm test
