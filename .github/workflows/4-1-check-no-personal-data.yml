name: "4.1 Check: no personal data committed"

# Fails a pull request, or a push to main, that adds personal data to this
# PUBLIC repository.
#
# History: 773 rows of physician name + department + score (csv_2569_01-04/)
# and 18 department heads' personal email addresses (automation/sql/
# dept_heads.sql) were both committed and published. .gitignore only named one
# specific filename at the time, so neither was caught. This is the backstop
# that does not depend on remembering to update a denylist.
#
# Scope: files ADDED, COPIED, MODIFIED or RENAMED by the PR or push, not the
# whole tree — the history still contains the original leak, and failing every
# run on that helps nobody. Renames count: a roster pasted into x.sql and then
# renamed to x-old.sql must not pass as "only renamed".
#
# It only blocks a merge if branch protection lists it as a required check.

on:
  pull_request:
    branches: [main]
  # A direct push to main never opens a PR, so scan pushes too.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed files for personal data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        env:
          # PR: the PR's own changes. Push: what this push added to main.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          # NUL-separated names: plain --name-only prints a Thai file name
          # quoted with octal escapes, which then fails the [ -f ] test below
          # and is skipped without being scanned.
          list=$(mktemp)
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # A new branch, or a force push whose old tip is gone: nothing to
            # diff against, so scan every tracked file.
            echo "No usable base commit; scanning every tracked file."
            git ls-files -z > "$list"
          # Three dots: only what the PR (or push) itself changed, not files
          # that main changed since the branch was cut.
          elif ! git diff -z --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > "$list"; then
            echo "::error::Could not list the changed files ($BASE_SHA...$HEAD_SHA)."
            exit 1
          fi
          [ -s "$list" ] || { echo "No added/modified files."; exit 0; }

          # Email addresses that are not personal data:
          #  - reserved example domains (RFC 2606 / 6761): example.com, .net,
          #    .org and anything under .example, .test, .invalid, .localhost;
          #  - SYSTEM_MAILBOXES, the project's own accounts: the P4P inbox that
          #    receives submissions and the Drive owner. They appear in
          #    config, and flagging them would fail every PR that touches
          #    automation/config.ts;
          #  - Google Drive's no-reply sender, which the inbox filter and its
          #    tests match on;
          #  - fake placeholders already used in comments, tests and SQL
          #    examples.
          #  Add an exact address here only if it is not a person's.
          email_ok='@(([a-z0-9-]+\.)*example\.(com|net|org)|([a-z0-9-]+\.)+(example|test|invalid|localhost))$'
          email_ok="$email_ok"'|^(sakhonmso|p4pskh)@gmail\.com$'
          email_ok="$email_ok"'|^drive-shares-dm-noreply@google\.com$'
          email_ok="$email_ok"'|^(dr@hosp\.com|x@y\.com|a@b\.co|someone@else\.com|new@email\.com)$'

          # npm copies package maintainers' contact addresses into the
          # "deprecated" notices of package-lock.json. Those lines come from
          # the npm registry, not from us; the rest of the file is scanned.
          email_source() {
            case "$1" in
              package-lock.json|*/package-lock.json) grep -av '"deprecated":' "$1" ;;
              *) cat "$1" ;;
            esac
          }

          fail=0

          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue

            # Skip this workflow and the docs that necessarily discuss the
            # leak, or the guard would flag its own explanation.
            case "$f" in
              .github/workflows/4-1-check-no-personal-data.yml|.gitignore) continue ;;
              DATA_EXPOSURE_ANALYSIS.md|SECURITY_ANALYSIS.md) continue ;;
            esac

            # 1. Tabular data files have no business being added at all.
            case "$f" in
              *.csv|*.xlsx|*.xls)
                echo "::error file=$f::Spreadsheet/CSV added. Roster data belongs in Supabase, not in this public repo."
                fail=1
                continue
                ;;
            esac

            # Only scan text.
            file --mime "$f" | grep -q 'charset=binary' && continue

            # 2. Email addresses, any domain: hospital and .go.th addresses
            #    are as personal as gmail ones. Allowed: email_ok above.
            hits=$(email_source "$f" 2>/dev/null \
                   | grep -aoiE '[a-z0-9._%+-]+@([a-z0-9-]+\.)+[a-z]{2,}' \
                   | tr '[:upper:]' '[:lower:]' | grep -vE "$email_ok" | sort -u || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::Email address(es) found. Personal addresses belong in Supabase (the dept_heads table is also the login allow-list), not in this public repo."
              echo "$hits" | sed 's/^/    /'
              fail=1
            fi

            # 3. LINE user ids: U followed by 32 hex digits. Each one names a
            #    person's LINE account, so it lives in env vars and Supabase.
            #    Only the line number and the first characters are printed, so
            #    the public log does not repeat the id.
            ids=$(grep -anoE '\bU[0-9a-f]{32}\b' "$f" 2>/dev/null \
                  | sed -E 's/^([0-9]+):(U[0-9a-f]{4}).*/    line \1: \2.../' || true)
            if [ -n "$ids" ]; then
              echo "::error file=$f::LINE user id(s) found. Keep them in env vars or Supabase, not in this public repo."
              echo "$ids"
              fail=1
            fi

            # 4. A physician roster in any file format.
            #
            #    DENSITY, not presence. The first version of this rule asked
            #    only "does the file contain two Thai words AND the word
            #    score/department?" — which flagged 33 legitimate source files,
            #    because the ENT department is spelled "โสต ศอ นาสิก" and
            #    contains spaces, so every file carrying the department list
            #    matched. That would have failed essentially every PR.
            #
            #    A real roster has one name per LINE START (CSV, TSV, SQL
            #    values, a pasted table). Source code has Thai strings embedded
            #    mid-line inside quotes and almost never at column 0. Measured:
            #    the leaked 2569_01.csv has 185 such lines; main.js,
            #    departments.ts and automation/index.js each have 0.
            #    `grep -c` prints "0" AND exits 1 when there is no match, so
            #    `|| echo 0` would append a SECOND zero and make the numeric
            #    test below blow up with "integer expression expected".
            names=$(grep -acE '^[[:space:]]*[("'"'"']?[ก-๙]{2,}[[:space:]]+[ก-๙]{2,}' "$f" 2>/dev/null || true)
            [ -z "$names" ] && names=0
            if [ "$names" -ge 20 ]; then
              echo "::error file=$f::Looks like a physician roster — $names name-shaped rows. Roster data belongs in Supabase."
              fail=1
            fi
          done < "$list"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "PII guard failed. This repository is public."
            echo "If a match is a false positive, add an explicit exception in this workflow"
            echo "and say why in the PR description."
            exit 1
          fi

          echo "PII guard passed — no personal data in the changed files."
