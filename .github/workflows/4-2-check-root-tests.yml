name: "4.2 Check: root tests"

# The parity guard between lib/p4p-score.ts and automation/claude-analyst.ts
# only guards anything if it actually runs: a vendored copy that nothing
# checks is just two files that will disagree eventually (see
# lib/__tests__/parity.test.mjs).
#
# Any workflow change runs it too: lib/__tests__/workflows.test.mjs runs the
# shell steps of several workflows.
#
# The paths below are every file outside lib/ that a root test reads or loads:
# the process/ scripts, the SQL in scripts/ and automation/sql/ and its ledger,
# and the automation files the parity and guard tests compare against. A change
# to any of them could break a root test, so it runs this check.
on:
  push:
    paths:
      - "lib/**"
      - "main.ts"
      - "assets/**"
      - "upload/**"
      - "src/**"
      - "verify/**"
      - "web/lib/config.ts"
      - "process/**"
      - "scripts/**"
      - "SUPABASE_MIGRATIONS.md"
      - "automation/claude-analyst.ts"
      - "automation/config.ts"
      - "automation/telegram.ts"
      - "automation/zip-guard.ts"
      - "automation/sql/**"
      - "automation/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "lib/**"
      - "main.ts"
      - "assets/**"
      - "upload/**"
      - "src/**"
      - "verify/**"
      - "web/lib/config.ts"
      - "process/**"
      - "scripts/**"
      - "SUPABASE_MIGRATIONS.md"
      - "automation/claude-analyst.ts"
      - "automation/config.ts"
      - "automation/telegram.ts"
      - "automation/zip-guard.ts"
      - "automation/sql/**"
      - "automation/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The behavioural half of the parity test imports automation/'s own copy,
      # which pulls in that project's dependency tree. Without this the test
      # skips that half and only the textual comparison runs.
      - name: Install automation dependencies (for the parity test)
        run: npm ci
        working-directory: automation

      # fill-score, preprocess-drive, review-build and review-pdf load process/
      # modules, which need process/'s own dependencies. Without them those
      # tests skip and a broken process/ change still passes this check.
      - name: Install process dependencies (for the process/ tests)
        run: npm ci
        working-directory: process
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - run: npm test

      - run: npx eslint lib upload assets
