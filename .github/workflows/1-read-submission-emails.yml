name: "1. Read submission emails (manual backup)"

# The inbox is now read every minute by the always-on relay in
# line-upload-processing.yml (automation/scripts/drain-uploads.ts). This used
# to run on an hourly cron, which GitHub delayed by 4-6 hours under load.
#
# Manual only, and only for when the relay is down: run while the relay is
# alive and both can read the same unread message at once and process it
# twice (two replies, two score writes).
on:
  workflow_dispatch:

concurrency:
  group: extract-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill if stuck (safety net)
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: npm ci               # ci is faster and stricter than npm install

      - name: Run P4P processor
        env:
          GOOGLE_CLIENT_ID      : ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET  : ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN  : ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY     : ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL    : ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_MODEL          : ${{ secrets.CLAUDE_MODEL }}
          SUPABASE_URL          : ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY          : ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN    : ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID      : ${{ secrets.TELEGRAM_CHAT_ID }}
          P4P_FOLDER_ID         : ${{ secrets.P4P_FOLDER_ID }}
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "▶ Attempt $attempt"
            npx tsx index.ts 2>&1 | tee run.log && break
            if [ $attempt -lt 2 ]; then
              echo "⚠️ Attempt $attempt failed — retrying in 30s…"
              sleep 30
            else
              echo "❌ All attempts failed."
              exit 1
            fi
          done

      # Run-log artifact upload REMOVED. automation/index.js logs physician
      # names per submission ("✅ Physician : <name>"), and artifacts on a
      # public repository are downloadable by anyone — so a 30-day retention
      # made this a rolling PII feed. The log is still written to disk and is
      # visible in the job output to anyone with repo access; only the
      # public, retained copy is gone. Re-enable only after names are
      # redacted at the point of logging.
