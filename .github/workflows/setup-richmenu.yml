name: Setup Rich Menu (3-block main menu, no upload)

# Manual switch: creates the 3-block main rich menu — status / ranking /
# person list — and sets it as the default for every LINE OA user
# immediately. There is deliberately no upload block: submitting a file from
# the rich menu is switched off. Run this once after merging to replace the
# live menu, which keeps showing whatever was last pushed until then.
# Deliberately workflow_dispatch only, never scheduled — the script itself
# says "run it once".
#
# Uses the same LINE_TOKEN secret update-month-picker.yml already runs
# monthly against this channel — nothing new to add.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-richmenu:
    name: Create + activate the 3-block rich menu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create and activate rich menu
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: npx tsx scripts/setup-richmenu.mts
