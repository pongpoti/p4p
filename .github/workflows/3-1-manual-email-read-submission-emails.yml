name: "3.1 Manual · Email: read submission emails (backup)"

# The inbox is now read every minute by the always-on relay in
# 1-always-on-process-line-uploads-and-emails.yml (automation/scripts/drain-uploads.ts). This used
# to run on an hourly cron, which GitHub delayed by 4-6 hours under load.
#
# Manual only, and only for when the relay is down: two inbox readers at once
# can both pick up the same unread message and process it twice (two replies,
# two score writes, two Drive uploads). Two guards enforce that:
#
#  1. relay-check refuses to go on while relay 1 has any run queued or
#     running.
#  2. process then joins relay 1's concurrency group (upload-drain), so a
#     relay run that starts meanwhile (its cron restarts a broken chain)
#     waits until this job ends instead of reading the inbox alongside it.
#
# Why both: GitHub keeps only ONE pending run per concurrency group, and a new
# pending run cancels the older one. Joining upload-drain while the relay is
# alive would therefore cancel the relay's queued next run (the one its
# hand-over just started) and break the chain. Checking first means this job
# only joins the group when the relay has nothing queued to displace.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-check:
    name: Check the always-on relay is stopped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read           # list relay 1's runs
    steps:
      - name: Refuse while relay 1 is queued or running
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY: 1-always-on-process-line-uploads-and-emails.yml
        run: |
          set -euo pipefail
          # Unfinished = queued, waiting its turn in upload-drain, or running.
          if ! alive=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$RELAY" --limit 30 \
              --json status,url --jq '[.[] | select(.status != "completed")]'); then
            echo "::error::Could not list the runs of $RELAY, so it may still be reading the inbox. Not reading it here."
            exit 1
          fi
          n=$(jq length <<< "$alive")
          if [ "$n" -gt 0 ]; then
            echo "::error::Relay 1 has $n run(s) queued or running, and it already reads the inbox every minute. Running this as well would process the same email twice."
            jq -r '.[] | "    \(.status): \(.url)"' <<< "$alive"
            echo "Use this only while the relay is stopped: disable workflow 1 in the Actions tab,"
            echo "cancel its runs, run this again, then enable 1 and press Run workflow on it."
            exit 1
          fi
          echo "Relay 1 has no run queued or running; reading the inbox once."

  process:
    needs: relay-check
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill if stuck (safety net)
    # Relay 1's group (see the top of this file).
    concurrency:
      group: upload-drain
      cancel-in-progress: false
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: npm ci               # ci is faster and stricter than npm install

      - name: Run P4P processor
        env:
          GOOGLE_CLIENT_ID      : ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET  : ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN  : ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY     : ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL    : ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_MODEL          : ${{ secrets.CLAUDE_MODEL }}
          SUPABASE_URL          : ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY          : ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN    : ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID      : ${{ secrets.TELEGRAM_CHAT_ID }}
          P4P_FOLDER_ID         : ${{ secrets.P4P_FOLDER_ID }}
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "▶ Attempt $attempt"
            npx tsx index.ts 2>&1 | tee run.log && break
            if [ $attempt -lt 2 ]; then
              echo "⚠️ Attempt $attempt failed — retrying in 30s…"
              sleep 30
            else
              echo "❌ All attempts failed."
              exit 1
            fi
          done

      # Run-log artifact upload REMOVED. automation/index.js logs physician
      # names per submission ("✅ Physician : <name>"), and artifacts on a
      # public repository are downloadable by anyone — so a 30-day retention
      # made this a rolling PII feed. The log is still written to disk and is
      # visible in the job output to anyone with repo access; only the
      # public, retained copy is gone. Re-enable only after names are
      # redacted at the point of logging.
