name: Monthly Eligible Physician List (PDF)

# Publishes a Thai-language PDF of every physician on the new month's roster
# (grouped by department, one section each) to a fixed Google Drive folder.
on:
  schedule:
    # 09:00 Bangkok time (02:00 UTC) on the 1st of every month — a few hours
    # after provision-month.yml creates that month's roster table (which
    # fires at 01:00 Bangkok on the 1st), so the table is guaranteed to exist.
    - cron: '0 2 1 * *'
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      target_month:
        description: 'Force a specific month instead of the current one (BE year-month, e.g. 2569-07 for July 2026). Leave blank to use the current month.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: process/package-lock.json

      - name: Install Puppeteer system dependencies
        run: sudo apt-get install -y libgbm1

      - name: Install dependencies
        working-directory: process
        run: npm ci

      - name: Generate eligible physician list PDF
        working-directory: process
        env:
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          # Drive folder for the monthly eligible-physicians PDF. Was hardcoded
          # in eligible-list.js while this repo was public.
          P4P_ELIGIBLE_FOLDER_ID: ${{ secrets.P4P_ELIGIBLE_FOLDER_ID }}
          TARGET_MONTH: ${{ inputs.target_month }}
        run: node eligible-list.js
