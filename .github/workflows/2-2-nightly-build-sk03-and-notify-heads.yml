name: "2.2 Nightly: build SK03 files and notify department heads"

on:
  schedule:
    # Runs every day at ~17:37 UTC (~00:37 Bangkok time, UTC+7, next day) —
    # just after local midnight, when no one is touching the shared Drive
    # folders. Offset 37 minutes past the hour, not on a round number like
    # :00/:15/:30/:45 — GitHub Actions scheduled runs queue behind everyone
    # else's crons (especially top-of-hour and other round minutes) and can
    # be delayed by hours; an uncommon minute lands in a less congested slot.
    - cron: '37 17 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI
    inputs:
      test_dept:
        description: "score-tracker job only: restrict to this department (comma-separated); blank = normal run over all departments"
        required: false
        default: ""
      test_email:
        description: "score-tracker job only: send to this address instead of the real dept head, and skip marking months as sent; blank = normal run"
        required: false
        default: ""
      month:
        description: "build only this month (e.g. 2569_10) and skip the dept-head emails; blank = normal run. The dashboard's ตรวจสอบ tab starts these through workflow 1"
        required: false
        default: ""
      request_id:
        description: "set by workflow 1 for a ตรวจสอบ tab request; leave blank"
        required: false
        default: ""

permissions:
  contents: read

# One build at a time: the nightly run and a ตรวจสอบ tab request both
# replace the month's SK03 and merged file on Drive.
concurrency:
  group: sk03-build
  cancel-in-progress: false

jobs:
  process:
    name: Create SK03 + merge files
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: process/package-lock.json

      - name: Install dependencies
        working-directory: process
        run: npm ci

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Preprocess Drive folders (trash older duplicates & unrelated files)
        working-directory: process
        env:
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ROOT_FOLDER_ID:  ${{ secrets.GOOGLE_ROOT_FOLDER_ID }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}
        run: npx tsx preprocess-drive.ts

      - name: Run process pipeline
        working-directory: process
        env:
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ROOT_FOLDER_ID:  ${{ secrets.GOOGLE_ROOT_FOLDER_ID }}
          GOOGLE_MERGE_FOLDER_ID: ${{ secrets.GOOGLE_MERGE_FOLDER_ID }}
          GOOGLE_SK03_FOLDER_ID:  ${{ secrets.GOOGLE_SK03_FOLDER_ID }}
          GOOGLE_SK03_TEMPLATE_ID: ${{ secrets.GOOGLE_SK03_TEMPLATE_ID }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:           ${{ secrets.SUPABASE_KEY }}
          TARGET_MONTH:           ${{ inputs.month }}
          REVIEW_REQUEST_ID:      ${{ inputs.request_id }}
        run: npx tsx process.ts

      # A ตรวจสอบ tab request whose run stopped before process.ts closed it
      # (an earlier step failed, the run was cancelled or hit timeout-minutes,
      # process.ts was killed) would wait as "building" until review_state's
      # time-out. Close it now, only while it is still open, so a request
      # process.ts already closed keeps its own reason. The nightly run has no
      # request_id and never gets here. Never fails the job further.
      - name: Close the ตรวจสอบ tab request if the run stopped
        if: (failure() || cancelled()) && inputs.request_id != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REQUEST_ID:   ${{ inputs.request_id }}
        run: |
          if ! [[ "$REQUEST_ID" =~ ^[0-9]{1,18}$ ]]; then echo "No valid request id, nothing to close."; exit 0; fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "Request $REQUEST_ID: Supabase secrets missing, not closed."; exit 0; fi
          body="{\"status\":\"failed\",\"error\":\"การสร้างไฟล์หยุดก่อนเสร็จ (งาน 2.2 ล้มเหลวหรือถูกยกเลิก)\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          # The key goes to curl on stdin (-H @-), never on the command line or in the log.
          code=$(printf 'apikey: %s\nAuthorization: Bearer %s\n' "$SUPABASE_KEY" "$SUPABASE_KEY" |
            curl -sS -g -o /dev/null -w '%{http_code}' --max-time 30 -X PATCH \
              "${SUPABASE_URL%/}/rest/v1/review_requests?id=eq.${REQUEST_ID}&status=in.(queued,dispatched,running)" \
              -H @- -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
              --data "$body" 2>/dev/null) || code="no answer"
          echo "Request $REQUEST_ID: closed as failed if still open (HTTP $code)"
          exit 0

      # Run-log artifact upload REMOVED — see .github/workflows/3-1-manual-email-read-submission-emails.yml
      # for the reasoning. These logs carry physician names and this repo is
      # public, so the retained artifact was readable by anyone.

  notify-dept-heads:
    name: Check completion & notify dept heads
    needs: process
    # Notification is logically independent of merge/SK03 success — a
    # pipeline hiccup on the `process` job shouldn't also silence the
    # completion email heads are waiting on. A one-month build from the
    # ตรวจสอบ tab sends nothing.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.month == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run score tracker
        env:
          # Gmail OAuth (shared with the process job)
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Supabase
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          # Department -> head email comes from the Supabase dept_heads
          # table (see automation/sql/dept_heads.sql), not a secret.
          # Oversight summary recipient. Was hardcoded in score-tracker.ts,
          # which published a personal address in this public repo. If this
          # secret is missing the summary copy is skipped with a warning and
          # the dept-head reports still send.
          OVERSIGHT_EMAIL:      ${{ secrets.OVERSIGHT_EMAIL }}
          # Google Drive root folder ID for P4P files (used to resolve per-physician links)
          P4P_FOLDER_ID:        ${{ secrets.P4P_FOLDER_ID }}
          # Manual-run test overrides — blank on the scheduled run (see workflow_dispatch inputs above)
          TEST_DEPT:            ${{ inputs.test_dept }}
          TEST_EMAIL:           ${{ inputs.test_email }}
        run: npx tsx scripts/score-tracker.ts
