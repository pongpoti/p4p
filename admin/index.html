<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAKHONMSO P4P — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&family=Noto+Sans+Thai+Looped:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #A68966;
            --primary-dark: #8f7255;
            --secondary: #4B3D33;
            --tertiary: #F5F5F0;
            --neutral: #FAF9F6;
            --text: #2d2d2d;
            --text-muted: #6b6b6b;
            --muted: #9A8A7A;
            --border: #e4ddd3;
            --danger: #c0392b;
            --danger-soft: #fdecea;
            --ok: #2e7d32;
            --ok-soft: #e6f4ea;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(75, 61, 51, .04), 0 4px 16px rgba(75, 61, 51, .07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            background: var(--neutral);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Desktop block ───────────────────────────────────── */
        #desktop-block {
            display: none;
            position: fixed; inset: 0;
            background: var(--neutral);
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 32px; z-index: 999;
        }
        #desktop-block h2 {
            font-family: 'Manrope', 'Noto Sans Thai Looped', sans-serif;
            font-size: 1.35rem; font-weight: 700; color: var(--secondary); margin-bottom: 8px;
        }
        #desktop-block p { color: var(--muted); font-size: .95rem; }

        /* Header */
        #header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: "Manrope", "Noto Sans Thai Looped", sans-serif;
            box-shadow: 0 2px 12px rgba(75, 61, 51, .18);
        }
        #header h1 { font-size: 1.08rem; font-weight: 800; letter-spacing: .01em; }
        #logout-btn {
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: #fff;
            border-radius: 999px; padding: 7px 14px; font-size: .78rem; font-weight: 600; cursor: pointer;
            transition: background .15s;
        }
        #logout-btn:active { background: rgba(255,255,255,.28); }
        #header-actions { display: flex; align-items: center; gap: 8px; }
        #requests-btn {
            position: relative;
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: #fff;
            border-radius: 999px; padding: 7px 14px; font-size: .78rem; font-weight: 600; cursor: pointer;
        }
        #requests-btn:active { background: rgba(255,255,255,.28); }
        #requests-badge {
            display: inline-block; min-width: 16px; padding: 1px 5px; margin-left: 4px;
            background: var(--danger); color: #fff; border-radius: 999px; font-size: .68rem; font-weight: 700;
        }

        /* Access-request cards reuse .row-card's look via shared classes below */
        #requests-panel { padding: 0 14px 10px; }
        #requests-panel .row-card-name { font-weight: 600; }
        #requests-panel .req-email { font-size: .82rem; color: var(--text-muted); margin-top: 2px; }
        .btn-approve { background: var(--ok-soft); color: var(--ok); }
        .btn-reject { background: var(--danger-soft); color: var(--danger); }

        /* Sticky filter bar */
        #filter-bar {
            position: sticky;
            top: 56px;
            z-index: 15;
            background: rgba(250, 249, 246, .92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #table_select {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            background: #fff;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--secondary);
        }
        .filter-row { display: flex; gap: 8px; }
        .search-box {
            flex: 1;
            display: flex; align-items: center; gap: 6px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 8px 14px;
        }
        .search-box svg { width: 15px; height: 15px; opacity: .4; flex-shrink: 0; }
        #search_input {
            border: none; outline: none; background: transparent;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            font-size: 0.88rem; width: 100%; color: var(--text);
        }
        #search_input::placeholder { color: #b9ada0; }
        #dept_filter {
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 8px 12px;
            background: #fff;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            font-size: 0.82rem;
            color: var(--secondary);
            max-width: 40%;
        }
        #add-btn {
            border: none; border-radius: var(--radius-sm);
            padding: 13px 18px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            background: var(--secondary); color: #fff; white-space: nowrap;
            display: flex; align-items: center; gap: 8px; justify-content: center;
            width: 100%;
        }
        #add-btn svg { width: 14px; height: 14px; }

        /* Spinner */
        #load {
            width: 32px; height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* Unauthorized */
        #unauthorized {
            padding: 48px 24px;
            text-align: center;
        }
        #unauthorized h2 {
            font-family: "Manrope", "Noto Sans Thai Looped", sans-serif;
            font-size: 1.15rem; color: var(--secondary); margin-bottom: 10px; font-weight: 800;
        }
        #unauthorized p { color: var(--text-muted); font-size: .9rem; line-height: 1.7; }
        #unauthorized code {
            display: inline-block; margin-top: 4px; padding: 3px 10px;
            background: var(--tertiary); border-radius: 999px; color: var(--secondary); font-weight: 600;
        }

        /* Content */
        #content { padding: 14px 14px 60px; }

        #row-count { font-size: .78rem; color: var(--text-muted); margin: 2px 4px 10px; font-weight: 500; }

        /* Row cards */
        .row-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            box-shadow: var(--shadow);
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color .15s;
        }
        .row-card.editing { border-color: var(--primary); }

        .row-card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            cursor: pointer;
            user-select: none;
        }
        .row-card-name {
            flex: 1;
            min-width: 0;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dept-badge {
            flex-shrink: 0;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--primary-dark);
            background: #f1e9df;
            padding: 3px 10px;
            border-radius: 999px;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chevron {
            flex-shrink: 0;
            width: 18px; height: 18px;
            color: var(--muted);
            transition: transform .2s ease;
        }
        .row-card.expanded .chevron { transform: rotate(180deg); }

        .row-card-body {
            display: none;
            padding: 0 14px 14px;
            border-top: 1px solid var(--tertiary);
            padding-top: 10px;
        }
        .row-card.expanded .row-card-body { display: block; }

        .field-line {
            display: flex; align-items: center; gap: 10px;
            padding: 5px 0;
        }
        .field-label {
            width: 88px; flex-shrink: 0;
            font-size: .73rem; color: var(--text-muted); font-weight: 500;
        }
        .field-value { font-size: .92rem; word-break: break-word; }
        .field-line input,
        .field-line select {
            flex: 1; min-width: 0;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 7px 10px;
            font-size: 0.88rem;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            background: #fff;
            color: var(--text);
        }
        .row-actions {
            display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;
        }
        .row-btn {
            border: none; border-radius: 999px;
            padding: 8px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
            font-family: "Work Sans", "Noto Sans Thai Looped", sans-serif;
            transition: opacity .15s;
        }
        .row-btn:active { opacity: .75; }
        .btn-edit { background: var(--tertiary); color: var(--secondary); }
        .btn-save { background: var(--ok); color: #fff; }
        .btn-cancel { background: var(--tertiary); color: var(--text-muted); }
        .btn-delete { background: var(--danger-soft); color: var(--danger); }

        #new-row-card { display: none; padding: 14px; }

        #empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: .88rem;
        }

        #status_msg {
            font-size: .82rem; text-align: center; padding: 9px; border-radius: var(--radius-sm);
            margin-bottom: 10px; font-weight: 500;
        }
        #status_msg.ok { background: var(--ok-soft); color: var(--ok); }
        #status_msg.error { background: var(--danger-soft); color: var(--danger); }
        #status_msg.hidden { display: none; }
    </style>
</head>

<body>
    <div id="desktop-block">
        <h2>ไม่รองรับการใช้งานบนคอมพิวเตอร์</h2>
        <p>กรุณาเปิดลิงก์นี้ผ่านโทรศัพท์มือถือ</p>
    </div>

    <div id="unauthorized" class="hidden">
        <h2>เข้าถึงไม่ได้</h2>
        <p>
            หน้านี้สำหรับผู้ดูแลระบบเท่านั้น<br>
            กรุณาส่งข้อความ <code>admin</code> ให้บอท LINE ของระบบ<br>
            เพื่อรับลิงก์เข้าสู่ระบบ
        </p>
    </div>

    <div id="app" class="hidden">
        <div id="header">
            <h1>Roster Admin</h1>
            <div id="header-actions">
                <button id="requests-btn" type="button">คำขอเข้าใช้งาน<span id="requests-badge" class="hidden">0</span></button>
                <button id="logout-btn" type="button">ออกจากระบบ</button>
            </div>
        </div>
        <div id="requests-panel" class="hidden">
            <div id="requests-list"></div>
            <div id="requests-empty" class="hidden" style="padding:14px 0;color:var(--text-muted);font-size:.85rem;">ไม่มีคำขอค้างอยู่</div>
        </div>
        <div id="filter-bar">
            <select id="table_select"></select>
            <div class="filter-row">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    <input id="search_input" type="search" placeholder="ค้นหาชื่อ..." autocomplete="off">
                </div>
                <select id="dept_filter"></select>
            </div>
        </div>
        <div id="content">
            <div id="status_msg" class="hidden"></div>
            <div id="row-count"></div>
            <button id="add-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                เพิ่มแถวใหม่
            </button>
            <div id="load"></div>
            <div id="new-row-card" class="row-card editing" style="margin-top:10px;"></div>
            <div id="rows" style="margin-top:10px;"></div>
            <div id="empty-state" class="hidden">ไม่พบข้อมูล</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
